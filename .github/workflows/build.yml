name: build-installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - name: Build
        working-directory: gui
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: craft-installer-${{ runner.os }}
          path: |
            gui/target/release/craftget-gui
            gui/target/release/craftget-gui.exe
          if-no-files-found: ignore
