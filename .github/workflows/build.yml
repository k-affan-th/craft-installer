name: build-installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: CraftInstaller-windows-x64.exe
          - os: macos-latest
            asset: CraftInstaller-macos-arm64.tar.gz
          - os: ubuntu-latest
            asset: CraftInstaller-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - name: Build
        working-directory: gui
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp gui/target/release/craftget-gui.exe "dist/${{ matrix.asset }}"
          else
            cp gui/target/release/craftget-gui CraftInstaller
            tar -czf "dist/${{ matrix.asset }}" CraftInstaller   # tar keeps the executable bit
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" ./* --repo "${{ github.repository }}" --title "Craft Installer ${{ github.ref_name }}" --generate-notes
