[package]
name = "craftget-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = "3.4.2"

[profile.release]
opt-level = "s"
lto = true
strip = true

[build-dependencies]
winresource = "0.1.31"
